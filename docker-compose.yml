# Local development database. The password is for your own machine only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: charging
      POSTGRES_PASSWORD: charging
      POSTGRES_DB: charging
    ports:
      # The port on your machine. Change DB_PORT in .env if something else already uses it.
      - "${DB_PORT:-54329}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charging"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
